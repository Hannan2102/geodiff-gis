name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API lint, types, tests (PostGIS)
    runs-on: ubuntu-24.04
    services:
      postgis:
        # Same image and Postgres major version as compose.yaml.
        image: imresamu/postgis:17-3.5
        env:
          POSTGRES_USER: geodiff
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: geodiff
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U geodiff -d geodiff"
          --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://geodiff:ci-only-password@localhost:5432/geodiff
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.7"
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python -m geodiff.migrate
      - run: uv run pytest -q

  web:
    name: Web lint, types, unit tests, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Clean boot + browser review journey
    runs-on: ubuntu-24.04
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7
      - name: Boot the compose stack from a clean checkout
        run: docker compose up --build -d --wait
        env:
          GIT_SHA: ${{ github.sha }}
      - name: Readiness
        run: curl -fsS http://localhost:8000/ready
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - working-directory: web
        run: npx playwright test
      - if: failure()
        run: docker compose logs --no-color | tail -200
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7
