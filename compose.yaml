# One-command local stack: `docker compose up --build`, then open http://localhost:8080
name: geodiff

x-db-env: &db-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-geodiff}:${POSTGRES_PASSWORD:-geodiff-local-dev}@db:5432/${POSTGRES_DB:-geodiff}

services:
  db:
    # Multi-arch build of the official postgis/postgis Dockerfile (Postgres 17, PostGIS 3.5).
    # CI uses the same image so local and CI share a Postgres major version.
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geodiff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geodiff-local-dev}
      POSTGRES_DB: ${POSTGRES_DB:-geodiff}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [backend]

  migrate:
    build: ./api
    command: ["python", "-m", "geodiff.migrate"]
    environment:
      <<: *db-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  api:
    build: ./api
    environment:
      <<: *db-env
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173,http://localhost:4173
      DB_POOL_MAX: ${DB_POOL_MAX:-4}
      GIT_SHA: ${GIT_SHA:-local}
      # Local stack only: end-to-end runs create many workspaces. Production keeps the defaults (20/hour, 200 active).
      RATE_LIMIT_WORKSPACES_PER_HOUR: ${RATE_LIMIT_WORKSPACES_PER_HOUR:-1000}
      MAX_ACTIVE_WORKSPACES: ${MAX_ACTIVE_WORKSPACES:-5000}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [backend, frontend]

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend]

volumes:
  pgdata:

networks:
  backend:
  frontend:
