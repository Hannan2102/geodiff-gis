server {
  listen 80;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  location / { try_files $uri $uri/ /index.html; }
  # MapLibre's worker is an ES module (.mjs); module workers require a JavaScript MIME type.
  location ~* \.mjs$ {
    types { } default_type text/javascript;
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
  }
  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff always; }
}
